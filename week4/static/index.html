<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RFFI领域助手</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
        #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        .user-msg { color: blue; margin: 8px 0; }
        .ai-msg { color: black; margin: 8px 0; white-space: pre-wrap; }
        input { width: 500px; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <h2>卫星通信/RFFI领域助手</h2>
    <div id="chat-box"></div>
    <input type="text" id="question-input" placeholder="输入你的问题...">
    <button onclick="sendQuestion()">发送</button>

    <script>
        async function sendQuestion() {
            const input = document.getElementById("question-input");
            const question = input.value;
            if (question.trim() === "") return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="user-msg">你：${question}</div>`;
            input.value = "";

            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question })
            });
            const data = await response.json();

            chatBox.innerHTML += `<div class="ai-msg">AI：${data.answer}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
